<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">CNCMaps TS · 地图渲染器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow glow-a"></div>
<div class="glow glow-b"></div>

<header class="topbar">
  <div class="brand">
    <span class="logo">◈</span>
    <div class="brand-text">
      <h1>CNCMaps <span>TS</span></h1>
      <p data-i18n="tagline">Red Alert 2 / Yuri's Revenge · 地图渲染器</p>
    </div>
  </div>
  <div class="topbar-right">
    <button id="langBtn" class="lang-btn">🌐 English</button>
    <div class="engine-tag" id="engineTag">引擎 · 自动</div>
  </div>
</header>

<main class="layout">
  <!-- 左：来源 -->
  <section class="panel sources">
    <h2 class="panel-title"><span>01</span><span data-i18n="srcTitle">地图来源</span></h2>

    <label class="field-label" data-i18n="srcLabel">选择地图（上传本机地图文件）</label>
    <div class="row">
      <button id="uploadBtn" class="btn btn-ghost upload-lg"><span data-i18n="uploadBtn">📁 上传地图文件</span></button>
    </div>
    <input id="fileInput" type="file" accept=".map,.yrm,.mpr" hidden>

    <label class="field-label" data-i18n="curLabel">当前选择</label>
    <div class="maplist" id="maplist">
      <div class="maplist-empty" data-i18n="maplistEmpty">请上传一个 .map / .yrm / .mpr 地图文件</div>
    </div>
  </section>

  <!-- 中：参数 -->
  <section class="panel params">
    <h2 class="panel-title"><span>02</span><span data-i18n="paramsTitle">渲染参数</span></h2>

    <div class="grid2">
      <div class="field">
        <label data-i18n="lblFormat">输出格式</label>
        <select id="format">
          <option value="png" selected>PNG</option>
          <option value="jpg">JPEG</option>
        </select>
      </div>
      <div class="field">
        <label data-i18n="lblEngine">引擎</label>
        <select id="engine">
          <option value="" selected data-i18n="engineAuto">自动检测</option>
          <option value="yr" data-i18n="engineYR">尤里的复仇 (YR)</option>
          <option value="ra2" data-i18n="engineRA2">红色警戒 2 (RA2)</option>
          <option value="ts" data-i18n="engineTS">泰伯利亚之日 (TS)</option>
          <option value="fs" data-i18n="engineFS">火风暴 (FS)</option>
        </select>
      </div>
    </div>

    <div class="grid2">
      <div class="field">
        <label data-i18n="lblSizeMode">尺寸模式</label>
        <select id="sizeMode">
          <option value="" selected data-i18n="sizeAuto">自动</option>
          <option value="local" data-i18n="sizeLocal">局部 (LocalSize)</option>
          <option value="full" data-i18n="sizeFull">全图 (FullMap)</option>
        </select>
      </div>
      <div class="field" id="pngCompressionField">
        <label><span data-i18n="lblPngComp">PNG 压缩</span> <span id="pngCompressionVal">4</span></label>
        <input id="pngCompression" type="range" min="1" max="9" value="4">
      </div>
    </div>

    <div class="toggles">
      <label class="toggle"><input type="checkbox" id="markStartPos"><span class="tk"></span><span data-i18n="tglStartPos">标记出生点</span></label>
      <label class="toggle"><input type="checkbox" id="markOre"><span class="tk"></span><span data-i18n="tglOre">高亮矿石</span></label>
    </div>

    <div class="render-zone">
      <button id="renderBtn" class="btn btn-primary" disabled>
        <span class="play">▶</span> <span data-i18n="renderBtn">开始渲染</span>
      </button>
      <div class="render-state" id="renderState" data-i18n="renderStateIdle">尚未渲染</div>
    </div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-meta">
        <span id="progressPct">0%</span>
        <span id="progressPhase" data-i18n="phaseWait">等待开始</span>
      </div>
    </div>
  </section>

  <!-- 右：预览 -->
  <section class="panel preview">
    <h2 class="panel-title"><span>03</span><span data-i18n="prevTitle">预览</span></h2>
    <div class="preview-frame" id="previewFrame">
      <div class="placeholder" id="placeholder">
        <div class="ph-icon">🛰</div>
        <p data-i18n="previewPlaceholder">渲染完成后自动显示地图预览</p>
      </div>
      <img id="previewImg" alt="" data-i18n-alt="previewAlt" data-i18n-prevalt="1" style="display:none">
    </div>
    <div class="preview-tools">
      <button id="downloadBtn" class="btn btn-ghost" disabled><span data-i18n="downloadImg">⬇ 下载图片</span></button>
      <span class="preview-tip" data-i18n="previewTip">点击预览图可放大查看</span>
    </div>
    <div class="preview-meta" id="previewMeta"></div>
  </section>
</main>

<footer class="statusbar">
  <span class="left"><span id="statusDot" class="dot"></span><span id="statusText" data-i18n="statusReady">就绪</span></span>
  <span class="credit" id="credit"></span>
  <span class="right">
    <span class="sbinfo" id="infoMaps"></span>
    <span class="sbinfo" id="infoRender" data-i18n="infoRenderEmpty">最近: 尚未渲染</span>
  </span>
</footer>

<!-- 图片放大查看 -->
<div class="lightbox-backdrop" id="lightbox" hidden>
  <div class="lightbox-card">
    <div class="lightbox-head">
      <span id="lightboxTitle" data-i18n="lightboxTitle">图片预览</span>
      <button class="modal-close" id="lightboxClose" aria-label="关闭" data-i18n-aria="closeLabel">×</button>
    </div>
    <div class="lightbox-body" id="lightboxBody">
      <img id="lightboxImg" alt="" data-i18n-alt="previewAlt" data-i18n-prevalt="1">
    </div>
    <div class="lightbox-foot">
      <div class="zoom-ctl">
        <button class="zbtn" data-zoom="out" title="缩小" data-i18n-title="zoomOut">−</button>
        <span class="zoom-pct" id="zoomPct">100%</span>
        <button class="zbtn" data-zoom="in" title="放大" data-i18n-title="zoomIn">＋</button>
        <button class="zbtn" data-zoom="fit" title="适应窗口" data-i18n-title="zoomFit">适应</button>
        <button class="zbtn" data-zoom="1" title="实际大小" data-i18n-title="zoom100">100%</button>
      </div>
      <a class="btn btn-primary" id="lightboxDownload" href="#" download>⬇ 下载原图</a>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
